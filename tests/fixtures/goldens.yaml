# Fixture golden set for the planted-failure corpus.
#
# `evidence` is quoted text from the document body; the loader resolves it to a
# character span with whitespace normalized, so these stay readable and survive
# re-wrapping of the source documents.
#
# `planted` is the GROUND TRUTH — the failure deliberately built into the
# corpus. It is authored from intent and confirmed by primitive retrieval
# measurements (rank of the gold chunk, span coverage under each chunking,
# whether the production filter excludes the document). It is never derived from
# running the classifier. See tests/fixtures/README.md.

